<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-name="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9, #e2e8f0);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }

        .card-wrapper {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            padding: 2px;
            border-radius: 18px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.15);
        }

        .card {
            background: #ffffff;
            padding: 26px;
            border-radius: 16px;
            width: 100%;
            color: #1e293b;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .info-box {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 16px 0;
            text-align: left;
            font-size: 14px;
        }

        .info-box p {
            margin: 10px 0;
            color: #475569;
        }

        .info-box span {
            color: #1e293b;
            font-weight: 600;
        }

        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #b91c1c;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <h2>🫱🏻‍🫲🏻 Welcome!</h2>
            <div class="info-box">
                <p>👤 Name: <span id="userName"></span></p>
                <p>📧 Email: <span id="userEmail"></span></p>
                <p>🔢 Age: <span id="userAge"></span></p>
                <p>🌍 Country: <span id="userCountry"></span></p>
                <p>📅 Date Of Birth: <span id="userDob"></span></p>
            </div>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

<script>
        // Yeh cache fix hai: Agar page browser ki memory (bfcache) se aaye toh foran reload ho kar check kare
        window.addEventListener("pageshow", function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });

        var currentUser = JSON.parse(localStorage.getItem("currentUser"));
        
        if (!currentUser) {
            location.replace("login.html");
        } else {
            document.getElementById("userName").innerText = currentUser.name;
            document.getElementById("userEmail").innerText = currentUser.email;
            document.getElementById("userAge").innerText = currentUser.age;
            document.getElementById("userCountry").innerText = currentUser.country;
            document.getElementById("userDob").innerText = currentUser.dob;
        }

        var logoutBtn = document.getElementById("logoutBtn");
        logoutBtn.addEventListener("click", function() {
            localStorage.removeItem("currentUser");
            location.replace("login.html");
        });
    </script>
</body>
</html>
