<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-name="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9, #e2e8f0);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }

        .card-wrapper {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            padding: 2px;
            border-radius: 18px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.15);
        }

        .card {
            background: #ffffff;
            padding: 22px 26px;
            border-radius: 16px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 22px;
            font-weight: 600;
        }

        .input-box {
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            align-items: center;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .input-icon {
            padding: 0 12px;
            font-size: 14px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1.5px solid #cbd5e1;
            align-self: stretch;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: none;
            outline: none;
            font-size: 13px;
            background: transparent;
            color: #1e293b;
        }

        input::placeholder {
            color: #94a3b8;
        }

        select option {
            background: #ffffff;
            color: #1e293b;
        }

        .error {
            color: #dc2626;
            font-size: 11px;
            font-weight: 500;
            display: block;
            margin-top: 2px;
            min-height: 14px;
        }

        .success-msg {
            color: #16a34a;
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-top: 2px;
            min-height: 14px;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
            transition: all 0.3s ease;
        }

        button:hover {
            opacity: 0.95;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        p {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            margin: 14px 0 0 0;
        }

        a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <h2>🔐 Create Account</h2>
            
            <div class="input-box">
                <div class="input-group" id="groupName">
                    <span class="input-icon">👤</span>
                    <input type="text" id="name" placeholder="Enter Username">
                </div>
                <span id="errorName" class="error"></span>
            </div>

            <div class="input-box">
                <div class="input-group" id="groupEmail">
                    <span class="input-icon">📧</span>
                    <input type="email" id="email" placeholder="Enter email address">
                </div>
                <span id="errorEmail" class="error"></span>
            </div>

            <div class="input-box">
                <div class="input-group" id="groupPass">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="pass" placeholder="Enter password (min 8 chars)">
                </div>
                <span id="errorPass" class="error"></span>
            </div>

            <div class="input-box">
                <div class="input-group" id="groupAge">
                    <span class="input-icon">🔢</span>
                    <input type="number" id="age" placeholder="Enter age">
                </div>
                <span id="errorAge" class="error"></span>
            </div>

            <div class="input-box">
                <div class="input-group" id="groupCountry">
                    <span class="input-icon">🌍</span>
                    <select id="country">
                        <option value="">Select Country</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="India">India</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="Saudi Arabia">Saudi Arabia</option>
                        <option value="China">China</option>
                    </select>
                </div>
                <span id="errorCountry" class="error"></span>
            </div>

            <div class="input-box">
                <div class="input-group" id="groupDob">
                    <span class="input-icon">📅</span>
                    <input type="date" id="dob">
                </div>
                <span id="errorDob" class="error"></span>
            </div>

            <span id="signupMsg" class="success-msg"></span>
            <button id="btn">Sign Up</button>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
        var nameBox = document.getElementById("name");
        var emailBox = document.getElementById("email");
        var passBox = document.getElementById("pass");
        var ageBox = document.getElementById("age");
        var countryBox = document.getElementById("country");
        var dobBox = document.getElementById("dob");
        var btn = document.getElementById("btn");

        var groupName = document.getElementById("groupName");
        var groupEmail = document.getElementById("groupEmail");
        var groupPass = document.getElementById("groupPass");
        var groupAge = document.getElementById("groupAge");
        var groupCountry = document.getElementById("groupCountry");
        var groupDob = document.getElementById("groupDob");

        var errorName = document.getElementById("errorName");
        var errorEmail = document.getElementById("errorEmail");
        var errorPass = document.getElementById("errorPass");
        var errorAge = document.getElementById("errorAge");
        var errorCountry = document.getElementById("errorCountry");
        var errorDob = document.getElementById("errorDob");
        var signupMsg = document.getElementById("signupMsg");

        passBox.addEventListener("input", function() {
            if (passBox.value.length < 8) {
                errorPass.innerText = "Password must be at least 8 characters";
                groupPass.style.borderColor = "#dc2626";
            } else {
                errorPass.innerText = "";
                groupPass.style.borderColor = "#cbd5e1";
            }
        });

        nameBox.addEventListener("input", function() {
            errorName.innerText = "";
            groupName.style.borderColor = "#cbd5e1";
        });
        emailBox.addEventListener("input", function() {
            errorEmail.innerText = "";
            groupEmail.style.borderColor = "#cbd5e1";
        });
        ageBox.addEventListener("input", function() {
            errorAge.innerText = "";
            groupAge.style.borderColor = "#cbd5e1";
        });
        countryBox.addEventListener("change", function() {
            errorCountry.innerText = "";
            groupCountry.style.borderColor = "#cbd5e1";
        });
        dobBox.addEventListener("input", function() {
            errorDob.innerText = "";
            groupDob.style.borderColor = "#cbd5e1";
        });

        btn.addEventListener("click", function() {
            var isValid = true;
            signupMsg.innerText = "";

            if (nameBox.value === "") {
                errorName.innerText = "Please fill username";
                groupName.style.borderColor = "#dc2626";
                isValid = false;
            }

            if (emailBox.value === "") {
                errorEmail.innerText = "Please fill email";
                groupEmail.style.borderColor = "#dc2626";
                isValid = false;
            }

            if (passBox.value === "") {
                errorPass.innerText = "Please fill password";
                groupPass.style.borderColor = "#dc2626";
                isValid = false;
            } else if (passBox.value.length < 8) {
                errorPass.innerText = "Password must be at least 8 characters";
                groupPass.style.borderColor = "#dc2626";
                isValid = false;
            }

            if (ageBox.value === "") {
                errorAge.innerText = "Please fill age";
                groupAge.style.borderColor = "#dc2626";
                isValid = false;
            }

            if (countryBox.value === "") {
                errorCountry.innerText = "Please select country";
                groupCountry.style.borderColor = "#dc2626";
                isValid = false;
            }

            if (dobBox.value === "") {
                errorDob.innerText = "Please fill date of birth";
                groupDob.style.borderColor = "#dc2626";
                isValid = false;
            }

            if (isValid) {
                var usersList = JSON.parse(localStorage.getItem("users")) || [];

                var emailExists = false;
                for (var i = 0; i < usersList.length; i++) {
                    if (usersList[i].email === emailBox.value) {
                        emailExists = true;
                        break;
                    }
                }

                if (emailExists) {
                    errorEmail.innerText = "This email is already registered!";
                    groupEmail.style.borderColor = "#dc2626";
                } else {
                    var newUser = {
                        name: nameBox.value,
                        email: emailBox.value,
                        pass: passBox.value,
                        age: ageBox.value,
                        country: countryBox.value,
                        dob: dobBox.value
                    };

                    usersList.push(newUser);
                    localStorage.setItem("users", JSON.stringify(usersList));

                    signupMsg.style.color = "#16a34a";
                        location.replace("login.html")
                }
            }
        });
    </script>
</body>
</html>
